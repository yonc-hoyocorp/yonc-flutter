name: yonc_flutter_example
description: "A complete app over the yonc_flutter plugin: the model download, Turbo Mode and the account it credits."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # From the YOnC Pub repository, the way your app takes it (see README, section 1).
  yonc_flutter:
    hosted: https://ymm.jfrog.io/artifactory/api/pub/flutter-yonc-pub
    version: ^0.5.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
